kind: Deployment
apiVersion: apps/v1

metadata:
  name: frontend-deployment
  namespace: devboard
  labels:
      app: devboard-front

spec:
  replicas: 2
  selector:
    matchLabels:
      app: devboard-front

  template:
    metadata:
      name: devboard-frontend
      namespace: devboard
      labels:
        app: devboard-front

    spec:
      containers:
        - name: devboard-frontend    
          image: shashank971/devboard-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "5m"
              memory: "12Mi"
            limits:
              cpu: "10m"
              memory: "24Mi"   
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3            

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3            
            

