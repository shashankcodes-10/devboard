kind: Deployment
apiVersion: apps/v1

metadata:
  name: backend-deployment
  namespace: devboard
  labels:
    app: devboard-back

spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-back

  template:
    metadata:
      name: backend-devboard 
      namespace: devboard
      labels:
        app: devboard-back

    spec:
      containers:
       - name:  backend-devboard 
         image: shashank971/devboard-backend:latest
         ports:
          - containerPort: 8080
         envFrom:
          - secretRef:
              name: secret-devboard
         resources:
            requests:
              cpu: "5m"
              memory: "12Mi"
            limits:
              cpu: "10m"
              memory: "24Mi"

         startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 12     
            
         readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3    

         livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3  