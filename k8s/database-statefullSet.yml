kind: StatefulSet
apiVersion: apps/v1

metadata:
  name: postgres-statefulset
  namespace: devboard
  labels:
    app: devboard-db 

spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-db

  template:
    metadata:
      name: db-devboard 
      namespace: devboard
      labels:
        app: devboard-db

    spec:
      containers:
       - name:  db-devboard 
         image:  postgres:16
         ports:
          - containerPort: 5432
         envFrom:
          - secretRef:
              name: secret-devboard
          - configMapRef:
              name: configmap-devboard    
         volumeMounts:
          - name: db
            mountPath: /var/lib/postgresql/data

          - name: init
            mountPath:  /docker-entrypoint-initdb.d  
         resources:
            requests:
              cpu: "100m"
              memory: "250Mi"
            limits: 
              cpu: "200m"
              memory: "500Mi"     

         readinessProbe:
            exec:
               command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3 

         livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3         
      volumes:               
        - name: db
          persistentVolumeClaim:
            claimName: pvc-devboard         

        - name: init
          configMap:
            name: postgres-init       


