name: DOCKER push

on:
  workflow_call:

jobs:
  docker_push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folders: [frontend,backend]  
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.folders}}  
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders}}-githubactions:latest