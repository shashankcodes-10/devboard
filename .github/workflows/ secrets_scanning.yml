name: SECRETS SCANNING

on:
  workflow-call:
    
jobs:
  secrets_scanning:
    runs-on: runs-ubuntu
    steps: 
      - name: code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: git leaks    
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    